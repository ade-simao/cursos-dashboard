<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="https://cdn-icons-png.flaticon.com/128/2900/2900122.png"
      type="image/x-icon"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script type="module" src="scripts/helpers/hasProfile.js"></script>

    <link rel="stylesheet" href="styles/index.css" />
    <link rel="stylesheet" href="styles/login/index.css" />
    <title>Cursos | Login</title>
  </head>
  <body hidden>
    <div class="stars"></div>

    <main class="container">
      <div class="brand">
        <h1>Mundo da Programação</h1>

        <h2>DEV</h2>

        <p>Plataforma de aprendizagem para futuros desenvolvedores.</p>
      </div>

      <div class="login-card">
        <h3>Entrar</h3>

        <form id="login-form">
          <input type="email" name="email" placeholder="Seu e-mail" required />

          <input
            type="password"
            name="password"
            placeholder="Sua palavra-passe"
            required
          />

          <button type="submit" name="btn">Entrar</button>
        </form>
      </div>
    </main>

    <script type="module" src="scripts/index.js"></script>
    <script type="module" src="scripts/login/index.js"></script>
  </body>
</html>
